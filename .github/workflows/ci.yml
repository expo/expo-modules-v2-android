name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.incremental=false"

jobs:
  compiler-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        # -PskipDesktopNative: :compiler-plugin's tests compile against :api, whose classes would
        # otherwise pull in the desktop native build and the Hermes host it needs. The test-app job
        # is the one that builds and exercises that side.
        run: ./gradlew :compiler-plugin:test --stacktrace -PskipHermesEnvBuild -PskipDesktopNative

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-compiler-plugin
          path: |
            compiler-plugin/build/reports/tests/
            compiler-plugin/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  api:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        # -PskipDesktopNative: this job covers the JVM side only, see the compiler-plugin job.
        run: ./gradlew :api:test --stacktrace -PskipHermesEnvBuild -PskipDesktopNative

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-api
          path: |
            api/build/reports/tests/
            api/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  gradle-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew :gradle-plugin:test --stacktrace -PskipHermesEnvBuild -PskipDesktopNative

  # The JSI-level suites: they drive a real Hermes runtime through :test-support, which needs the
  # desktop Hermes host from expo/hermes-test-environment. It is published only to mavenLocal, so
  # this job builds it from a checkout next to this one and caches what it publishes.
  test-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          path: expo-modules-v2-android

      # Next to this checkout, under the name settings.gradle.kts looks for by default.
      - name: Check out hermes-test-environment
        uses: actions/checkout@v4
        with:
          repository: expo/hermes-test-environment
          path: hermes-tests-environment

      - name: Resolve the Hermes host revision
        id: hermes-env
        working-directory: hermes-tests-environment
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Building the host compiles the Hermes VM, which takes several minutes. What it publishes is
      # cached under the host's commit, so it is rebuilt only when that repository moves.
      - name: Restore the published Hermes host
        id: hermes-env-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/io/github/expo/hermes-test-environment
          key: hermes-test-environment-${{ runner.os }}-${{ runner.arch }}-${{ steps.hermes-env.outputs.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      # CMake ships with the runner image; Ninja does not.
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: expo-modules-v2-android

      - name: Build and publish the Hermes host to mavenLocal
        if: steps.hermes-env-cache.outputs.cache-hit != 'true'
        working-directory: hermes-tests-environment
        run: |
          git submodule update --init --recursive --depth 1
          ./gradlew :runtime:publishToMavenLocal --stacktrace

      # -PskipHermesEnvBuild: the host is already in mavenLocal, built above or restored from the
      # cache, so settings.gradle.kts must not compare source timestamps and publish it again.
      - name: Run tests
        working-directory: expo-modules-v2-android
        run: ./gradlew :test-app:test --stacktrace -PskipHermesEnvBuild

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-test-app
          path: |
            expo-modules-v2-android/test-app/build/reports/tests/
            expo-modules-v2-android/test-app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
