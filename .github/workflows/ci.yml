name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.incremental=false"

jobs:
  # The compiler plugin links against compiler internals, so every Kotlin release it is published
  # for gets its own build and test run. gradle/kotlin-versions.txt is the single list of those
  # releases (the publish workflow and scripts/test-all-versions.sh read the same file).
  kotlin-versions:
    name: Kotlin versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.read.outputs.versions }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Read gradle/kotlin-versions.txt
        id: read
        run: echo "versions=$(jq -R -s -c 'split("\n") | map(select(length > 0))' gradle/kotlin-versions.txt)" >> "$GITHUB_OUTPUT"

  test-kotlin:
    name: Kotlin ${{ matrix.kotlin-version }}
    needs: kotlin-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kotlin-version: ${{ fromJSON(needs.kotlin-versions.outputs.versions) }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The compiler plugin's own tests, the Gradle plugin compiled against that release's KGP, and
      # :api compiled with that release's compiler.
      # -PskipDesktopNative: :compiler-plugin's tests compile against :api, whose classes would
      # otherwise pull in the desktop native build and the Hermes host it needs. The test-app job
      # is the one that builds and exercises that side.
      - name: Run checks against Kotlin ${{ matrix.kotlin-version }}
        run: ./gradlew :compiler-plugin:test :gradle-plugin:build :api:test -PkotlinVersion=${{ matrix.kotlin-version }} --stacktrace -PskipHermesEnvBuild -PskipDesktopNative

      # always(), not failure(): the reports are the only record of how many tests actually ran.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-kotlin-${{ matrix.kotlin-version }}
          path: |
            compiler-plugin/build/reports/tests/
            compiler-plugin/build/test-results/
            api/build/reports/tests/
            api/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The JSI-level suites: they drive a real Hermes runtime through :test-support, which needs the
  # desktop Hermes host from expo/hermes-test-environment. It is published only to mavenLocal, so
  # this job builds it from a checkout next to this one and caches what it publishes.
  test-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          path: expo-modules-v2-android

      # Next to this checkout, under the name settings.gradle.kts looks for by default.
      - name: Check out hermes-test-environment
        uses: actions/checkout@v4
        with:
          repository: expo/hermes-test-environment
          path: hermes-tests-environment

      - name: Resolve the Hermes host revision
        id: hermes-env
        working-directory: hermes-tests-environment
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Building the host compiles the Hermes VM, which takes several minutes. What it publishes is
      # cached under the host's commit, so it is rebuilt only when that repository moves. Restore
      # and save are separate steps so the host is saved as soon as it is built, whether or not the
      # tests that follow pass.
      - name: Restore the published Hermes host
        id: hermes-env-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/io/github/expo/hermes-test-environment
          key: hermes-test-environment-${{ runner.os }}-${{ runner.arch }}-${{ steps.hermes-env.outputs.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      # CMake ships with the runner image; Ninja does not.
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: expo-modules-v2-android

      - name: Build and publish the Hermes host to mavenLocal
        if: steps.hermes-env-cache.outputs.cache-hit != 'true'
        working-directory: hermes-tests-environment
        run: |
          git submodule update --init --recursive --depth 1
          ./gradlew :runtime:publishToMavenLocal --stacktrace

      - name: Save the published Hermes host
        if: steps.hermes-env-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/io/github/expo/hermes-test-environment
          key: ${{ steps.hermes-env-cache.outputs.cache-primary-key }}

      # -PskipHermesEnvBuild: the host is already in mavenLocal, built above or restored from the
      # cache, so settings.gradle.kts must not compare source timestamps and publish it again.
      - name: Run tests
        working-directory: expo-modules-v2-android
        run: ./gradlew :test-app:test --stacktrace -PskipHermesEnvBuild

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-test-app
          path: |
            expo-modules-v2-android/test-app/build/reports/tests/
            expo-modules-v2-android/test-app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
